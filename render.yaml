# Render Blueprint: free web service built from the backend Dockerfile.
# Database: free MongoDB Atlas M0 (see docs/DEPLOY-FREE.md). Secrets are entered in the Render dashboard.
services:
  - type: web
    name: carryon-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: MONGODB_URI
        sync: false          # mongodb+srv://<user>:<password>@<cluster>.mongodb.net/carryon?retryWrites=true&w=majority
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false          # your frontend URL, e.g. https://carryon.pages.dev
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx300m -XX:+UseSerialGC   # free tier has 512 MB RAM
