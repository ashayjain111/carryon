spring:
  application:
    name: carryon
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carryon}
    username: ${DB_USER:carryon}
    password: ${DB_PASSWORD:carryon}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-use-32-plus-bytes}
  jwt-ttl-minutes: 60
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  admin-email: ${ADMIN_EMAIL:admin@carryon.local}
  admin-password: ${ADMIN_PASSWORD:admin12345}
  auth-rate-limit-per-minute: 20
  platform-fee-percent: 10
  auto-release-hours: 48
  max-declared-value-paise: 2500000
