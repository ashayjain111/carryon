services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carryon
      POSTGRES_USER: carryon
      POSTGRES_PASSWORD: carryon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carryon"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
